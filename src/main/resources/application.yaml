spring:
  application:
    name: product-catalog-synchronizer

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:productcatalog;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # H2 Console (for debugging)
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

