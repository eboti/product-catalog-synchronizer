spring:
  datasource:
    url: jdbc:h2:mem:productcatalog;MODE=MySQL;TRACE_LEVEL_SYSTEM_OUT=1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

